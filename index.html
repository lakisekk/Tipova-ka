  --brand:#b6ff3d; --brand-d:#8fd400; --brand-l:#caff70;
  --cta-bg:#aeff00; --cta-fg:#10154f;
  --red:#ff5f74;
  --bg:#080c33; --card:#111746; --card-2:#1a2159; --field:#161d52;
  --ink:#eaecf8; --muted:#9aa1cf;
  --line:#252c66; --line-s:#1c2356; --brand-line:rgba(174,255,0,.42);
  --hdr1:#161f73; --hdr2:#0d1348;
  --hero1:#1c2a99; --hero2:#141c6b; --hero3:#0b1042;
  --poster1:#0b1042; --poster2:#1c2a99;
  --pod1:#0b1042; --pod2:#1c2a99; --pod3:#141c6b;
  --ava1:#2f3cae; --ava2:#161f73;
  --ok-bg:rgba(174,255,0,.16); --ok-fg:#c6ff66; --ok-line:rgba(174,255,0,.38);
  --warn-bg:rgba(255,196,60,.17); --warn-fg:#ffd27a;
  --zero-bg:rgba(255,255,255,.08); --zero-fg:#a3a9d2;
  --err-bg:rgba(255,95,116,.14); --err-line:rgba(255,95,116,.36); --err-fg:#ff9aa8;
  --note-bg:rgba(174,255,0,.09); --note-line:rgba(174,255,0,.26); --note-fg:#d3e9a0;
  --tag-bg:rgba(255,255,255,.08);
  --live-bg:rgba(255,95,116,.16); --live-fg:#ff8b9c;
  --me-bg:rgba(174,255,0,.09); --hit-bg:rgba(174,255,0,.07); --lime-soft:rgba(174,255,0,.10);
  --dim:#5a629b; --dim-2:#6a72ab; --dot:#2b3372;
  --focus:rgba(174,255,0,.28); --ticker-bg:#0b1042;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --wrap:1120px;
}
html[data-theme="light"]{
  --lime:#aeff00;
  --brand:#1b2585; --brand-d:#111a63; --brand-l:#2b37a8;
  --cta-bg:#aeff00; --cta-fg:#10154f;
  --red:#c8102e;
  --bg:#f2f3fb; --card:#ffffff; --card-2:#f5f6fc; --field:#ffffff;
  --ink:#101538; --muted:#5f6690;
  --line:#e2e4f2; --line-s:#eef0f8; --brand-line:#c3c8ea;
  --hdr1:#161f73; --hdr2:#0d1348;
  --hero1:#1e2a9c; --hero2:#161f73; --hero3:#0d1348;
  --poster1:#0d1348; --poster2:#1e2a9c;
  --pod1:#0d1348; --pod2:#1e2a9c; --pod3:#161f73;
  --ava1:#2f3cae; --ava2:#161f73;
  --ok-bg:#e9ffc4; --ok-fg:#3d6b00; --ok-line:#cdf58c;
  --warn-bg:#fff1cf; --warn-fg:#8a5b00;
  --zero-bg:#f1f2f8; --zero-fg:#6b7299;
  --err-bg:#fdf3f5; --err-line:#f2cdd4; --err-fg:#8a2233;
  --note-bg:#f7ffe8; --note-line:#d9f2a8; --note-fg:#4a6b16;
  --tag-bg:#eef0f8;
  --live-bg:#fdeaee; --live-fg:#c8102e;
  --me-bg:#f4ffdf; --hit-bg:#f9ffee; --lime-soft:#f6ffe4;
  --dim:#aab0d0; --dim-2:#b8bdd8; --dot:#dcdff0;
  --focus:rgba(27,37,133,.16); --ticker-bg:#eef0f9;
  --shadow:0 1px 2px rgba(16,21,56,.06), 0 6px 20px rgba(16,21,56,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'ChanceSans','Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  font-feature-settings:'kern' 1,'liga' 1;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--brand); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand-l); outline-offset:2px; border-radius:4px}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1,h2,h3{line-height:1.18; margin:0 0 .5em; letter-spacing:-.022em; font-weight:700}
h2{font-size:19px}
h3{font-size:16px}

/* ---------- header ---------- */
.site-header{background:linear-gradient(180deg,var(--hdr1) 0%,var(--hdr2) 100%); color:#fff; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(8,45,25,.25)}
.site-header .wrap{display:flex; align-items:center; gap:18px; min-height:58px}
.brand{display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none}
.brand:hover{text-decoration:none}
.brand-badge{width:34px;height:34px;border-radius:9px;background:var(--lime);color:#10154f;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.brand-title{display:block;font-weight:700;font-size:16.5px;letter-spacing:-.015em}
.brand-title b{color:var(--lime);font-weight:700}
.brand-sub{display:block;font-size:11.5px;opacity:.78;margin-top:1px}
.nav{margin-left:auto; display:flex; align-items:center; gap:2px}
.nav a{color:#d7dbf5; padding:8px 11px; border-radius:8px; font-size:14px; font-weight:500}
.nav a:hover{background:rgba(255,255,255,.12); text-decoration:none}
.nav a.active{background:var(--lime); color:#10154f; font-weight:700}
@media (max-width:860px){ .nav{display:none} }

/* ---------- pás s logy ---------- */
.ticker{overflow:hidden;background:var(--ticker-bg);
  border-bottom:1px solid var(--line);padding:18px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-track{display:flex;width:max-content;animation:ticker 46s linear infinite}
.ticker-track>*{margin-right:46px;flex:none}
.ticker:hover .ticker-track,.ticker:focus-within .ticker-track{animation-play-state:paused}
/* Na tmavé se tmavé znaky ztrácejí — jemný světlý obrys je vytáhne. */
html[data-theme="dark"] .ticker .crest::after{filter:drop-shadow(0 0 2px rgba(255,255,255,.5))}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:700px){
  .ticker{padding:12px 0}
  .ticker-track{animation-duration:32s}
  .ticker-track>*{margin-right:30px}
}
@media (prefers-reduced-motion:reduce){
  .ticker{overflow-x:auto;scrollbar-width:none}
  .ticker::-webkit-scrollbar{display:none}
  .ticker-track{animation:none}
}

/* ---------- crest ---------- */
.crest{display:inline-grid;place-items:center;flex:none;border-radius:50%;position:relative;
  background:linear-gradient(135deg,var(--c1) 0 50%, var(--c2) 50% 100%);
  color:#fff; font-weight:800; letter-spacing:-.02em;
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.16);
  text-shadow:0 1px 2px rgba(0,0,0,.55); overflow:hidden}
.crest.s{width:22px;height:22px;font-size:8px}
.crest.m{width:28px;height:28px;font-size:9.5px}
.crest.l{width:44px;height:44px;font-size:14px}
.crest.xl{width:112px;height:112px;font-size:34px}
@media (max-width:700px){ .crest.xl{width:68px;height:68px;font-size:21px} }
/* V pásu chceme čisté logo — bez bílého kolečka i bez rámečku. */
.crest.plain::after{background-color:transparent;background-size:contain;border-radius:0}
/* Vrstva s logem. Zapne ji až pravidlo vygenerované po nalezení souboru. */
.crest::after{content:"";position:absolute;inset:0;border-radius:50%;display:none;
  background:#fff center center / 78% auto no-repeat}

/* ---------- generic ---------- */
main{padding:18px 0 92px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); margin-bottom:16px}
.card>h2:first-child{margin-top:0}
.grid{display:grid; gap:16px}
.cols-2{grid-template-columns:1fr 1fr}
@media (max-width:840px){ .cols-2{grid-template-columns:1fr} }
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{text-align:right; font-variant-numeric:tabular-nums}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--cta-bg);color:var(--cta-fg);border:1px solid var(--cta-bg);
  padding:9px 15px;border-radius:9px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{background:#c2ff3d;border-color:#c2ff3d;text-decoration:none}
.btn.secondary{background:var(--card);color:var(--brand);border-color:var(--line)}
.btn.secondary:hover{background:var(--card-2);border-color:var(--brand-line)}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--err-line)}
.btn.danger:hover{background:var(--err-bg)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-l);box-shadow:0 0 0 3px var(--focus)}
textarea{width:100%;resize:vertical;font-size:14px;line-height:1.45}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
label.fld>input,label.fld>select{width:100%}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-s);text-align:left}
th{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.me{background:var(--me-bg)}
.table-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.medal{width:30px;font-size:15px}
.rankno{width:30px;color:var(--muted);font-variant-numeric:tabular-nums}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--tag-bg);color:var(--muted)}
.tag.live{background:var(--live-bg);color:var(--live-fg)}
.tag.done{background:var(--ok-bg);color:var(--ok-fg)}
.tag.open{background:var(--warn-bg);color:var(--warn-fg)}

/* ---------- hero ---------- */
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);color:#fff;border-radius:var(--r);
  padding:24px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.hero h1{font-size:31px;font-weight:800;letter-spacing:-.032em;margin:2px 0 10px}
.hero h1 b{color:var(--lime);font-weight:800}
.hero-eyebrow{font-size:11.5px;font-weight:600;opacity:.85;letter-spacing:.16em;text-transform:uppercase}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;opacity:.92}
.hero-note{margin-top:12px;display:inline-block;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.hero-sm{padding:20px 22px}
.hero-sm h1{font-size:25px;margin:2px 0 6px}
.card ul{margin:0 0 14px;padding-left:20px}
.card li{margin-bottom:5px}
.card p:last-child{margin-bottom:0}
@media (max-width:560px){ .hero h1{font-size:24px} }

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:1px}
@media (max-width:640px){ .stats{grid-template-columns:1fr 1fr} }

/* ---------- match rows ---------- */
.match{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line-s);
  color:inherit;text-decoration:none;border-radius:8px;margin:0 -4px}
.match:hover{background:var(--card-2);text-decoration:none}
.match:last-child{border-bottom:0}
.match .when{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.match .teams{display:flex;align-items:center;gap:8px;min-width:0}
.match .side{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.match .side.away{flex-direction:row-reverse;text-align:right}
.match .side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.match .vs{color:var(--muted);font-size:12px;flex:none}
.match .score{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.match .score .tbd{color:var(--dim);font-weight:600}
@media (max-width:620px){
  .match{grid-template-columns:1fr 64px;grid-template-areas:"when when" "teams score"}
  .match .when{grid-area:when;flex-direction:row;gap:8px;margin-bottom:2px}
  .match .teams{grid-area:teams}
  .match .score{grid-area:score}
}

/* ---------- poster ---------- */
.poster{background:linear-gradient(140deg,var(--poster1) 0%,var(--poster2) 100%);color:#fff;border-radius:var(--r);
  padding:22px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow)}
.poster .tagline{font-size:11.5px;opacity:.85;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.poster .amount{font-size:40px;font-weight:800;letter-spacing:-.035em;color:var(--lime);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.poster .sub{font-size:14px;opacity:.92}
.poster .meta{margin-top:10px;font-size:13px;opacity:.8}

/* ---------- tip grid ---------- */
.tipgrid{display:grid;gap:8px}
.tiprow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.tiprow.locked{background:var(--card-2)}
.tipinputs{display:flex;align-items:center;gap:5px}
.tipinputs input{width:46px;text-align:center;padding:7px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.tipinputs .sep{color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.p3{background:var(--ok-bg);color:var(--ok-fg)}
.p1{background:var(--warn-bg);color:var(--warn-fg)}
.p0{background:var(--zero-bg);color:var(--zero-fg)}

.matrix{font-size:12.5px}
.matrix td,.matrix th{padding:5px 6px;text-align:center;white-space:nowrap}
.matrix th.pl,.matrix td.pl{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;font-weight:600}
.matrix thead th{font-size:11px}
.matrix thead th a{color:inherit;text-decoration:none}
.matrix thead th a:hover{color:var(--brand)}

.banner{border:1px solid var(--note-line);background:var(--note-bg);color:var(--note-fg);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner.err{border-color:var(--err-line);background:var(--err-bg);color:var(--err-fg)}
.banner.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-fg)}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.subnav button.on{background:var(--cta-bg);border-color:var(--cta-bg);color:var(--cta-fg)}

.roundpick{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.roundpick::-webkit-scrollbar{display:none}
.roundpick button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.roundpick button.on{background:var(--cta-bg);border-color:var(--cta-bg);color:var(--cta-fg)}
.roundpick button.done{border-color:var(--ok-line);color:var(--brand)}
.roundpick button.on.done{color:var(--cta-fg)}


/* ---------- profil hráče ---------- */
.avatar{display:inline-grid;place-items:center;border-radius:50%;flex:none;
  background:linear-gradient(140deg,var(--ava1),var(--ava2));color:#fff;font-weight:800;letter-spacing:-.02em;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.avatar.sm{width:30px;height:30px;font-size:13px}
.avatar.lg{width:62px;height:62px;font-size:27px}

.profile-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.profile-id{min-width:0;flex:1}
.profile-id h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 7px}
.profile-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.profile-score{text-align:right;line-height:1.05}
.profile-score b{display:block;font-size:38px;font-weight:800;letter-spacing:-.035em;color:var(--brand);font-variant-numeric:tabular-nums}
.profile-score span{font-size:12px;color:var(--muted)}
.rankbadge{display:inline-block;background:var(--cta-bg);color:var(--cta-fg);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.chip{display:inline-block;background:var(--tag-bg);color:var(--muted);font-weight:600;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.paid{background:var(--warn-bg);color:var(--warn-fg)}
.chip.mebtn{cursor:pointer;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip.mebtn:hover{border-color:var(--brand-line);background:var(--card-2)}
.chip.mebtn[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:#10154f}

.round-strip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.round-strip::-webkit-scrollbar{display:none}
.round-cell{flex:none;width:48px;text-align:center;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:6px 2px}
.round-cell b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.round-cell span{font-size:10.5px;color:var(--muted)}
.round-cell.hot{background:var(--ok-bg);border-color:var(--ok-line)}
.round-cell.hot b{color:var(--brand)}
.round-cell.empty b{color:var(--dim-2)}

.form{display:inline-flex;gap:3px;align-items:center}
.form i{width:9px;height:9px;border-radius:50%;background:var(--dot);display:block}
.form i.w{background:var(--brand)}
.form i.m{background:#ffc43c}
.form i.l{background:var(--dot)}

.pts{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.pts-5{background:var(--ok-bg);color:var(--ok-fg)}
.pts-1{background:var(--warn-bg);color:var(--warn-fg)}
.pts-0{background:var(--zero-bg);color:var(--zero-fg)}
.pts-none{color:var(--dim-2)}
tr.exact-hit{background:var(--hit-bg)}
.tbd{color:var(--dim)}

.plist{display:grid;gap:10px}
.plink{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 14px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
.plink:hover{text-decoration:none;border-color:var(--brand-line);background:var(--card-2)}
.plink .rk{width:28px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.plink .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plink .bd{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.plink .bd small{font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
.plink.me{border-color:var(--lime);background:var(--lime-soft)}

/* ---------- odpočet ---------- */
.countdown{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:26px 18px 24px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden}
.countdown::before{content:"";position:absolute;inset:-70% 25% auto;height:200px;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(174,255,0,.14),transparent 70%)}

const TEAMS = [

];
const TMAP = {}; TEAMS.forEach(t=>TMAP[t.k]=t);

// Losovací pořadí přesně podle oficiálního rozpisu Chance Ligy 2026/27.
const DRAW = [
  {r:11, date:"2026-10-17", m:[["Slovácko","Zbrojovka"],["Olomouc","Liberec"],["Boleslav","Teplice"],["Jablonec","Plzeň"],["Artis","Bohemians"],["Slavia","Hradec"],["Pardubice","Zlín"],["Baník","Sparta"]]},
  {r:12, date:"2026-10-24", m:[["Plzeň","Pardubice"],["Slavia","Boleslav"],["Hradec","Jablonec"],["Zlín","Olomouc"],["Teplice","Artis"],["Zbrojovka","Bohemians"],["Liberec","Baník"],["Sparta","Slovácko"]]},
  {r:13, date:"2026-10-31", m:[["Bohemians","Sparta"],["Baník","Plzeň"],["Pardubice","Liberec"],["Slovácko","Teplice"],["Olomouc","Zbrojovka"],["Boleslav","Hradec"],["Artis","Zlín"],["Jablonec","Slavia"]]},
  {r:14, date:"2026-11-07", m:[["Plzeň","Sparta"],["Liberec","Bohemians"],["Zbrojovka","Baník"],["Teplice","Pardubice"],["Zlín","Slovácko"],["Hradec","Olomouc"],["Jablonec","Boleslav"],["Slavia","Artis"]]},
  {r:15, date:"2026-11-21", m:[["Bohemians","Plzeň"],["Sparta","Liberec"],["Artis","Jablonec"],["Olomouc","Slavia"],["Slovácko","Hradec"],["Boleslav","Zlín"],["Baník","Teplice"],["Pardubice","Zbrojovka"]]},
  {r:16, date:"2026-11-28", m:[["Zbrojovka","Plzeň"],["Teplice","Liberec"],["Zlín","Sparta"],["Hradec","Bohemians"],["Slavia","Baník"],["Jablonec","Pardubice"],["Artis","Slovácko"],["Boleslav","Olomouc"]]},
  {r:17, date:"2026-12-05", m:[["Sparta","Boleslav"],["Olomouc","Artis"],["Slovácko","Jablonec"],["Pardubice","Slavia"],["Baník","Hradec"],["Bohemians","Zlín"],["Plzeň","Teplice"],["Liberec","Zbrojovka"]]},
  {r:18, date:"2026-12-12", m:[["Zlín","Plzeň"],["Slavia","Liberec"],["Teplice","Sparta"],["Jablonec","Bohemians"],["Artis","Baník"],["Boleslav","Pardubice"],["Olomouc","Slovácko"],["Hradec","Zbrojovka"]]},
  {r:19, date:"2027-01-30", m:[["Pardubice","Olomouc"],["Slovácko","Boleslav"],["Sparta","Artis"],["Baník","Jablonec"],["Bohemians","Slavia"],["Plzeň","Hradec"],["Liberec","Zlín"],["Zbrojovka","Teplice"]]},
  {r:20, date:"2027-02-06", m:[["Slovácko","Plzeň"],["Boleslav","Bohemians"],["Olomouc","Baník"],["Artis","Pardubice"],["Hradec","Liberec"],["Zlín","Zbrojovka"],["Slavia","Sparta"],["Jablonec","Teplice"]]}
];

// Orientační výkopy — datum kola je sobota, zápasy se rozloží na so/ne. Admin je může přepsat.
const SLOTS = [ [0,"15:00"],[0,"15:00"],[0,"15:00"],[0,"18:00"],[1,"13:00"],[1,"15:00"],[1,"17:00"],[1,"19:00"] ];

function buildFixtures(){
  const out=[];
  DRAW.forEach(rd=>{
    rd.m.forEach((pair,i)=>{
      const [off,time]=SLOTS[i];
      const d=new Date(rd.date+"T12:00:00"); d.setDate(d.getDate()+off);
      const iso=d.toISOString().slice(0,10);
      out.push({ id:"m"+rd.r+"-"+(i+1), r:rd.r, h:pair[0], a:pair[1], date:iso, time, hs:null, as:null });
    });
  });
  return out;
}

const ROUNDS = DRAW.map(d=>d.r);
const STORE_KEY   = "tipovacka_chl_2627_v1";
const MYTIPS_KEY  = "tipovacka_chl_2627_me";
const ADMINDEV_KEY= "tipovacka_chl_2627_admin";
const THEME_KEY   = "tipovacka_chl_2627_theme";

function currentTheme(){
  const a=document.documentElement.getAttribute("data-theme");
  if(a==="light"||a==="dark") return a;
  try{ return localStorage.getItem(THEME_KEY)==="light" ? "light" : "dark"; }catch(e){ return "dark"; }
}
function applyTheme(t){
  t = t==="light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="light" ? "#161f73" : "#0d1348");
}

/* ============================================================
   2. STAV
   ============================================================ */

function freshState(){
  return {
    v:1,
    updated:null,
    title:"Tipovačka Chance Liga 2026/27",
    players:[],                 // {id,name,paid}
    matches:buildFixtures(),    // výsledky
    tips:{},                    // tips[playerId][matchId] = {h,a}
    locks:{},                   // locks[round] = true → ručně uzamčeno
    logos:{},                   // logos[teamKey] = data URI nahraného loga
    cfg:{ fee:200, pin:"1234", potNote:"Vítěz bere vše", feedUrl:"" }
  };
}

let S = null;
let ADMIN = false;
let VIEW = { page:"home", round:null, tab:null, msg:null, more:false };

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ S = migrate(JSON.parse(raw)); return; }
  }catch(e){ console.warn("Nepovedlo se načíst uložená data:",e); }
  S = freshState();
}

function migrate(d){
  const base = freshState();
  const keepLogos = (S && S.logos) ? S.logos : {};
  const s = Object.assign(base, d);
  s.cfg = Object.assign(base.cfg, d.cfg||{});
  // Data bez log (čerstvý build, starší záloha) nesmí smazat loga, která už jsou nahraná.
  s.logos = (d.logos && Object.keys(d.logos).length) ? d.logos : keepLogos;
  // rozpis vždy srovnat se zabudovaným losem, výsledky a časy si ponechat
  const old = {}; (d.matches||[]).forEach(m=>old[m.id]=m);
  s.matches = buildFixtures().map(m=>{
    const o = old[m.id];
    return o ? Object.assign(m,{hs:o.hs??null, as:o.as??null, date:o.date||m.date, time:o.time||m.time}) : m;
  });
  return s;
}

function save(){
  S.updated = new Date().toISOString();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ alert("Data se nepodařilo uložit do prohlížeče: "+e.message); }
}

/* ============================================================
   3. POMOCNÉ FUNKCE
   ============================================================ */

const DAYS = ["ne","po","út","st","čt","pá","so"];
const MONTHS = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];

function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim(); }
function kick(m){ return new Date(m.date+"T"+m.time+":00"); }
function fmtDay(m){ const d=kick(m); return DAYS[d.getDay()]+" "+d.getDate()+". "+(d.getMonth()+1)+"."; }
function fmtLong(iso){ const d=new Date(iso+"T12:00:00"); return d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function played(m){ return m.hs!==null && m.as!==null; }
function crest(k,size){
  const t=TMAP[k]; if(!t) return "";
  return `<span class="crest ${size}" data-t="${t.sl}" style="--c1:${t.c1};--c2:${t.c2}" title="${esc(t.full)}">${t.ab}</span>`;
}

/* ---- kontrola před publikací ------------------------------------------- */
function audit(){
  const out=[];
  if(!S.players.length){
    out.push({lvl:"err", txt:"Nejsou přidaní žádní hráči."});
    return out;
  }
  // chybějící tipy
  const missing=[];
  ROUNDS.forEach(r=>{
    const ms=roundMatches(r);
    S.players.forEach(p=>{
      const n=ms.filter(m=>!tipOf(p.id,m.id)).length;
      if(n) missing.push({r, name:p.name, n, all:n===ms.length});
    });
  });
  if(missing.length){
    const byRound={};
    missing.forEach(x=>{ (byRound[x.r]=byRound[x.r]||[]).push(x); });
    Object.keys(byRound).sort((a,b)=>a-b).forEach(r=>{
      const list=byRound[r];
      const txt=list.map(x=>`${x.name} (${x.all?"celé kolo":x.n+"×"})`).join(", ");
      out.push({lvl:"warn", txt:`${r}. kolo — chybí tipy: ${txt}`});
    });
  }
  // rozehraná kola bez kompletních výsledků
  ROUNDS.forEach(r=>{
    const ms=roundMatches(r), done=ms.filter(played).length;
    if(done && done<ms.length)
      out.push({lvl:"warn", txt:`${r}. kolo — zadáno jen ${done} z ${ms.length} výsledků.`});
    if(!done && isLocked(r) && kick(ms[ms.length-1]) < new Date())
      out.push({lvl:"warn", txt:`${r}. kolo je odehrané, ale nemá zadaný ani jeden výsledek.`});
  });
  // vklady
  const unpaid=S.players.filter(p=>!p.paid);
  if(unpaid.length) out.push({lvl:"info", txt:`Vklad ještě nezaplatili: ${unpaid.map(p=>p.name).join(", ")}.`});
  // duplicitní jména
  const seen={};
  S.players.forEach(p=>{ const k=norm(p.name); if(seen[k]) out.push({lvl:"err",txt:`Dvakrát stejné jméno: ${p.name}.`}); seen[k]=1; });
  return out;
}

/* ---- publikace jedním souborem ----------------------------------------- */
// Vezme vlastní zdroják stránky, vloží do něj aktuální data a nabídne
// ho ke stažení. Výsledek je jeden soubor, který stačí nahrát na doménu.
function exportSite(btn){
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="Připravuji…"; }
  const restore=()=>{ if(btn){ btn.disabled=false; btn.textContent=label; } };

  fetch(location.pathname + (location.pathname.endsWith("/")?"":""), {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("stránku se nepodařilo načíst ("+r.status+")"); return r.text(); })
    .then(src=>{
      if(!/id="app"/.test(src)) throw new Error("načtený soubor nevypadá jako tahle stránka");
      // Značky skládám z kousků schválně — kdyby byl celý tag v kódu napsaný
      // vcelku, hledání by našlo samo sebe a ukously by se všechny skripty pod ním.
      const OPEN  = "<scr"+'ipt id="seed" type="application/json">';
      const CLOSE = "</scr"+"ipt>";
      const RE    = new RegExp("<scr"+'ipt id="seed"[\\s\\S]*?</scr'+"ipt>");
      const json  = JSON.stringify(S).replace(/<\//g,"<\\/");
      const block = OPEN + json + CLOSE;
      src = RE.test(src) ? src.replace(RE, ()=>block)
                         : src.replace("</head>", ()=>block+"\n</head>");
      download("index.html", src, "text/html");
      restore();
      toast("Hotovo. Nahraj index.html na doménu a je zveřejněno.");
    })
    .catch(err=>{
      restore();
      toast("Nejde to: "+err.message+". Když je stránka otevřená ze souboru (file://), prohlížeč čtení vlastního zdrojáku zakáže — nahraj ji nejdřív na doménu, nebo použij data.json.","err");
    });
}

// Přiřadí soubor k týmu podle názvu: slavia.png, ml-boleslav.svg,
// "FC Zbrojovka Brno.png", sigma_olomouc.png…
function teamFromFilename(name){
  const base = norm(String(name).replace(/\.[a-z0-9]+$/i,"").replace(/[_\-.]+/g," "));
  if(!base) return null;
  let hit = TEAMS.find(t=>norm(t.sl.replace(/-/g," "))===base) || TEAMS.find(t=>norm(t.k)===base);
  if(hit) return hit;
  const cands = TEAMS.filter(t=>{
    const names=[t.sl.replace(/-/g," "), t.k, t.full].concat(t.al).map(norm);
    return names.some(n=>base===n || base.includes(n) || n.includes(base));
  });
  return cands.length===1 ? cands[0] : null;
}

function loadLogoFiles(files, done){
  const list=[...files];
  const okList=[], skipped=[];
  let left=list.length;
  if(!left) return done(okList,skipped);
  list.forEach(f=>{
    const t=teamFromFilename(f.name);
    if(!t || f.size>4*1024*1024){ skipped.push(f.name); if(!--left) done(okList,skipped); return; }
    fileToLogo(f, uri=>{
      if(uri){ S.logos=S.logos||{}; S.logos[t.k]=uri; LOGOS[t.sl]=uri; okList.push(t.k); }
      else skipped.push(f.name);
      if(!--left) done(okList,skipped);
    });
  });
}

/* ---- loga klubů ---------------------------------------------------------
   Priorita: 1) obrázek nahraný ve Správě (uložený rovnou v datech)
             2) soubor ve složce loga/ vedle stránky (loga/slavia.png nebo .svg)
             3) barevný odznak s iniciálami — když nic z toho není
   Vše se řeší jedním CSS pravidlem na tým, takže dlouhá data URI je
   v dokumentu jen jednou, ne u každého z osmdesáti zápasů.                */
const LOGOS = {};

function logoStyles(){
  const el=document.getElementById("logostyles"); if(!el) return;
  el.textContent = Object.keys(LOGOS).map(sl=>{
    const url = LOGOS[sl].replace(/"/g,"%22");
    // Když logo existuje, schovej zkratku pod ním — jinak by prosvítala skrz.
    return `.crest[data-t="${sl}"]{color:transparent;text-shadow:none}\n`
         + `.crest[data-t="${sl}"]::after{display:block;background-image:url("${url}")}\n`
         + `.crest.plain[data-t="${sl}"]{background:none;box-shadow:none;border-radius:0}`;
  }).join("\n");
}

function resolveLogos(){
  logoStyles();
  if(typeof Image==="undefined") return;
  let waiting=0;
  const settle=()=>{ if(--waiting<=0) logoStyles(); };
  TEAMS.forEach(t=>{
    const own = S.logos && S.logos[t.k];
    if(own){ LOGOS[t.sl]=own; return; }
    const tryExt = exts => {
      if(!exts.length) return settle();
      const img=new Image();
      img.onload = ()=>{ LOGOS[t.sl]="loga/"+t.sl+"."+exts[0]; settle(); };
      img.onerror= ()=>tryExt(exts.slice(1));
      img.src="loga/"+t.sl+"."+exts[0];
    };
    waiting++; tryExt(["png","svg"]);
  });
  if(waiting) logoStyles();
}

// Zmenší nahraný obrázek na 128 px, ať data.json nenabobtná.
function fileToLogo(file, cb){
  const rd=new FileReader();
  rd.onerror=()=>cb(null);
  rd.onload=()=>{
    const img=new Image();
    img.onerror=()=>cb(null);
    img.onload=()=>{
      const N=128, c=document.createElement("canvas"); c.width=c.height=N;
      const ctx=c.getContext("2d");
      const r=Math.min(N/(img.width||N), N/(img.height||N));
      const w=(img.width||N)*r, h=(img.height||N)*r;
      ctx.drawImage(img,(N-w)/2,(N-h)/2,w,h);
      try{ cb(c.toDataURL("image/png")); }catch(e){ cb(null); }
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function roundMatches(r){ return S.matches.filter(m=>m.r===r); }
function deadline(r){ const ms=roundMatches(r).map(m=>kick(m).getTime()); return ms.length?new Date(Math.min(...ms)):null; }
function isLocked(r){
  if(S.locks[r]) return true;
  const d=deadline(r); return d ? Date.now() >= d.getTime() : false;
}
function roundState(r){
  const ms=roundMatches(r);
  if(ms.every(played)) return "done";
  if(!isLocked(r)) return "open";
  return "live";
}
function currentRound(){
  for(const r of ROUNDS){ if(roundState(r)!=="done") return r; }
  return ROUNDS[ROUNDS.length-1];
}
function points(tip,m){
  if(!tip || tip.h===null || tip.h===undefined || !played(m)) return null;
  if(tip.h===m.hs && tip.a===m.as) return 3;
  return Math.sign(tip.h-tip.a) === Math.sign(m.hs-m.as) ? 1 : 0;
}
function tipOf(pid,mid){ return (S.tips[pid]||{})[mid]||null; }
function setTip(pid,mid,h,a){
  if(!S.tips[pid]) S.tips[pid]={};
  if(h===null||h===""||a===null||a==="") delete S.tips[pid][mid];
  else S.tips[pid][mid]={h:+h,a:+a};
}
function uid(){ return "p"+Math.random().toString(36).slice(2,8); }

function standings(uptoRound){
  return S.players.map(p=>{
    let pts=0,ex=0,ok=0,cnt=0;
    S.matches.forEach(m=>{
      if(uptoRound && m.r>uptoRound) return;
      const v=points(tipOf(p.id,m.id),m);
      if(v===null) return;
      cnt++; pts+=v; if(v===3) ex++; if(v>=1) ok++;
    });
    return {p, pts, ex, ok, cnt};
  }).sort((x,y)=> y.pts-x.pts || y.ex-x.ex || x.p.name.localeCompare(y.p.name,"cs"));
}


function countdownText(target){
  let s = Math.max(0, Math.floor((target.getTime()-Date.now())/1000));
  const d=Math.floor(s/86400); s-=d*86400;
  const hh=Math.floor(s/3600);  s-=hh*3600;
  const mm=Math.floor(s/60);    const ss=s-mm*60;
  const pad=n=>String(n).padStart(2,"0");
  if(d>0) return `${d} ${d===1?"den":d<5?"dny":"dní"} ${pad(hh)}:${pad(mm)}:${pad(ss)}`;
  return `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}

function startTicker(){
  setInterval(()=>{
    const el=document.getElementById("countdown");
    if(!el) return;
    const dl=deadline(ROUNDS[0]);
    if(!dl) return;
    if(Date.now() >= dl.getTime()){ render(); return; }   // uzávěrka právě proběhla
    el.textContent = countdownText(dl);
  }, 1000);
}

function applyHash(){
  const h=(location.hash||"").replace(/^#\//,"");

const LINE_COLORS = ["#7ab800","#00b4d8","#ff7a45","#ff4f8b","#e3a500","#2bbd85","#a78bfa","#38bdf8","#fb7185","#17b3a3","#f59e0b","#c084fc","#6cc24a","#f472b6","#00c2e0"];

function progressChart(rows){
  const rs = ROUNDS.filter(r=>roundMatches(r).some(played));
  if(rs.length<2 || rows.length<2) return "";

  const series = rows.map((row,i)=>{
    let acc=0;
    const pts = rs.map(r=>{
      acc += roundMatches(r).reduce((s,m)=>s+(points(tipOf(row.p.id,m.id),m)||0),0);
      return acc;
    });
    return {name:row.p.name, id:row.p.id, pts, col:LINE_COLORS[i%LINE_COLORS.length]};
  });

  const max = Math.max(10, ...series.map(s=>Math.max(...s.pts)));
  // Na úzkém displeji užší plátno a větší popisky — jinak by text po zmenšení zmizel.
  const narrow = typeof window!=="undefined" && window.innerWidth && window.innerWidth<640;
  const W = narrow?380:720, H = narrow?280:300;
  const FS = narrow?14:11;
  const L = narrow?30:38, R=14, T=14, B = narrow?26:30;
  const px = i => L + (rs.length===1?0:i*(W-L-R)/(rs.length-1));
  const py = v => T + (H-T-B) * (1 - v/max);

  // vodorovné linky po rozumném kroku
  const step = max<=20?5 : max<=60?10 : max<=120?20 : 50;
  let grid="";
  for(let v=0; v<=max; v+=step){
    grid += `<line x1="${L}" y1="${py(v)}" x2="${W-R}" y2="${py(v)}" stroke="var(--line)" stroke-width="1"/>
             <text x="${L-7}" y="${py(v)+FS/3}" text-anchor="end" font-size="${FS}" fill="var(--muted)">${v}</text>`;
  }
  const xlab = rs.map((r,i)=>`<text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="${FS}" fill="var(--muted)">${r}.</text>`).join("");
  const me = myPlayerId();

  const lines = series.map(s=>{
    const d = s.pts.map((v,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(v).toFixed(1)).join(" ");
    const col = s.col;
    const mine = s.id===me;
    return `<g><path d="${d}" fill="none" stroke="${col}" stroke-width="${mine?3.2:1.9}"
      stroke-linejoin="round" stroke-linecap="round" opacity="${mine?1:.85}"/>
      ${s.pts.map((v,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="${mine?3.4:2.4}" fill="${col}"><title>${esc(s.name)} — po ${rs[i]}. kole ${v} b</title></circle>`).join("")}</g>`;
  }).join("");

  const legend = series.map(s=>`<span class="lg-item ${s.id===me?"on":""}" >
      <i style="background:${s.col}"></i>${esc(s.name)} <b>${s.pts[s.pts.length-1]}</b></span>`).join("");

  return `<div class="card">
    <h2>Vývoj pořadí</h2>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Graf průběžných bodů po kolech">
        ${grid}${xlab}${lines}
      </svg>
    </div>
    <div class="legend">${legend}</div>
  </div>`;
}

  const home=done.filter(m=>m.hs>m.as).length, draw=done.filter(m=>m.hs===m.as).length, away=done.filter(m=>m.hs<m.as).length;
  const scores={}; done.forEach(m=>{ const k=m.hs+":"+m.as; scores[k]=(scores[k]||0)+1; });
  const topScores=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const tipScores={};
  S.players.forEach(p=>Object.values(S.tips[p.id]||{}).forEach(t=>{ const k=t.h+":"+t.a; tipScores[k]=(tipScores[k]||0)+1; }));

/* ============================================================
   7. PARSER VÝSLEDKŮ
   ============================================================ */

const ALIASES = [];
TEAMS.forEach(t=>{
  const all = [t.k, t.full].concat(t.al).map(norm);
  [...new Set(all)].forEach(a=>ALIASES.push({a, k:t.k}));
});
ALIASES.sort((x,y)=>y.a.length-x.a.length);

function findTeams(line){
  const n = " "+norm(line)+" ";
  const hits=[]; const used=[];
  ALIASES.forEach(({a,k})=>{
    if(hits.some(h=>h.k===k)) return;
    let idx = n.indexOf(a);
    while(idx>-1){
      const overlaps = used.some(u=> idx < u.e && idx+a.length > u.s);
      if(!overlaps){ hits.push({k, i:idx}); used.push({s:idx,e:idx+a.length}); break; }
      idx = n.indexOf(a, idx+1);
    }
  });
  return hits.sort((x,y)=>x.i-y.i);
}

// Vyhodí z textu časy výkopu (15:00), datumy (17. 10.) a poločasy v závorce,
// aby se nepletly se skóre.
function cleanScoreText(s){
  return String(s)
    .replace(/\((\s*\d{1,2}\s*[:\-–—]\s*\d{1,2}\s*)\)/g," ")   // poločas (1:0)
    .replace(/\b\d{1,2}\s*:\s*[0-5]\d\b/g," ")                  // čas výkopu
    .replace(/\b\d{1,2}\s*\.\s*\d{1,2}\s*\.(\s*\d{2,4})?/g," ") // datum
    .replace(/\b(19|20)\d{2}\b/g," ");                          // rok
}

function readScore(text){
  const t = cleanScoreText(text);
  const m = t.match(/\b(\d{1,2})\s*[:\-–—]\s*(\d{1,2})\b/);
  if(m && +m[1]<=20 && +m[2]<=20) return [+m[1],+m[2]];
  const nums = (t.match(/\b\d{1,2}\b/g)||[]).map(Number).filter(n=>n<=20);
  if(nums.length>=2) return [nums[nums.length-2], nums[nums.length-1]];
  return null;
}

// Čte řádek po řádku, ale sbírá je do bufferu — zvládne tak i svislý formát,
// kde je každý tým a jeho góly na vlastním řádku.
function parseResults(text){
  const out=[]; const lines=String(text).split(/\r?\n/);
  let buf=[];
  const flush=(err)=>{ if(buf.length && err) out.push({line:buf.join(" ").trim(), err}); buf=[]; };

  for(let i=0;i<lines.length;i++){
    if(!lines[i].trim()){ flush(buf.length?"nenašel jsem u toho skóre":null); continue; }
    buf.push(lines[i]);
    const joined = buf.join(" ");
    const teams = findTeams(joined);
    if(teams.length<2) continue;
    if(teams.length>2){ // buffer se rozjel, začni znovu od aktuálního řádku
      out.push({line:joined.trim(), err:"na jedné položce jsou víc než dva týmy"});
      buf=[lines[i]]; continue;
    }
    const sc = readScore(joined);
    if(!sc) continue;                       // zatím jen týmy, skóre přijde dál
    const [x,y]=sc;
    const match = S.matches.find(m=>m.h===teams[0].k && m.a===teams[1].k)
               || S.matches.find(m=>m.h===teams[1].k && m.a===teams[0].k);
    if(!match){ out.push({line:joined.trim(), err:"tenhle zápas v kolech 11–20 není"}); buf=[]; continue; }
    const flip = match.h!==teams[0].k;
    out.push({line:joined.trim(), match, hs:flip?y:x, as:flip?x:y, flip});
    buf=[];
  }
  flush(buf.length?"nepoznal jsem týmy nebo skóre":null);
  return out;
}

function renderParse(rows){
  const okRows=rows.filter(r=>r.match), bad=rows.filter(r=>r.err);
  return `<div style="margin-top:14px">
    ${okRows.length?`<table><thead><tr><th>Kolo</th><th>Zápas</th><th class="num">Výsledek</th></tr></thead><tbody>
      ${okRows.map(r=>`<tr><td>${r.match.r}.</td><td>${esc(r.match.h)} – ${esc(r.match.a)}${r.flip?' <span class="tag">otočeno</span>':""}</td><td class="num"><strong>${r.hs}:${r.as}</strong></td></tr>`).join("")}
    </tbody></table>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="apply-parse">Zapsat ${okRows.length} výsledků</button></div>`
    :`<div class="banner err">Z vloženého textu se nepodařilo přečíst žádný zápas.</div>`}
    ${bad.length?`<div class="banner err" style="margin-top:12px">Nepřečtené řádky:<br>${bad.map(b=>esc(b.line)+" — "+b.err).join("<br>")}</div>`:""}
  </div>`;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-profil],[data-zapas],[data-round],[data-tab],[data-act]");
  if(!t) return;

  if(t.dataset.zapas){ e.preventDefault(); go("zapas",{match:t.dataset.zapas}); return; }
  if(t.dataset.profil){ e.preventDefault(); go("profil",{player:t.dataset.profil}); return; }
  if(t.dataset.go){ e.preventDefault(); go(t.dataset.go, t.dataset.round?{round:+t.dataset.round}:undefined); return; }
  if(t.dataset.round && !t.dataset.act){ VIEW.round=+t.dataset.round; render(); return; }
  if(t.dataset.tab){ VIEW.tab=t.dataset.tab; render(); return; }

  const act=t.dataset.act;
  const r = t.dataset.round ? +t.dataset.round : null;

  if(act==="more"){ VIEW.more=!VIEW.more; render(); return; }
  if(act==="theme"){ applyTheme(currentTheme()==="dark" ? "light" : "dark"); return; }

  if(act==="toggle-me"){
    setMyPlayerId(myPlayerId()===t.dataset.id ? "" : t.dataset.id);
    render(); return;
  }

  if(act==="login"){
    const v=document.getElementById("pin").value.trim();
    if(v===String(S.cfg.pin)){
      ADMIN=true; VIEW.tab="vysledky";
      try{ localStorage.setItem(ADMINDEV_KEY,"1"); }catch(e){}
      render();
    }
    else toast("Špatný PIN.","err");
  }
  else if(act==="logout"){ ADMIN=false; render(); }

  else if(act==="save-results"){
    let n=0;
    document.querySelectorAll("[data-res]").forEach(inp=>{
      if(inp.dataset.side!=="h") return;
      const mid=inp.dataset.res, m=S.matches.find(x=>x.id===mid);
      const a=document.querySelector(`[data-res="${mid}"][data-side="a"]`);
      if(inp.value!==""&&a.value!==""){ m.hs=+inp.value; m.as=+a.value; n++; }
      else { m.hs=null; m.as=null; }
    });
    save(); toast(`Zapsáno ${n} výsledků, body se přepočítaly.`);
  }
  else if(act==="clear-results"){
    if(!confirm(`Vymazat výsledky ${r}. kola?`)) return;
    roundMatches(r).forEach(m=>{m.hs=null;m.as=null;});
    save(); toast(`${r}. kolo vymazáno.`);
  }
  else if(act==="lock"){ S.locks[r]=t.checked; save(); }

  else if(act==="parse"){
    PARSED=parseResults(document.getElementById("paste").value);
    document.getElementById("parseout").innerHTML=renderParse(PARSED);
  }
  else if(act==="apply-parse"){
    let n=0; (PARSED||[]).forEach(row=>{ if(row.match){ row.match.hs=row.hs; row.match.as=row.as; n++; } });
    save(); PARSED=null; toast(`Zapsáno ${n} výsledků.`);
  }

  else if(act==="save-feed"){ S.cfg.feedUrl=document.getElementById("feedurl").value.trim(); save(); toast("Adresa uložena."); }
  else if(act==="fetch-feed"){
    const url=(document.getElementById("feedurl").value||"").trim();
    if(!url){ toast("Nejdřív vyplň adresu.","err"); return; }
    const out=document.getElementById("feedout");
    out.innerHTML=`<div class="banner">Načítám…</div>`;
    fetch(url,{cache:"no-store"}).then(x=>{ if(!x.ok) throw new Error("server odpověděl "+x.status); return x.json(); })
      .then(data=>{
        const arr=Array.isArray(data)?data:(data.matches||data.results||[]);
        let n=0, skip=0;
        arr.forEach(row=>{
          const h=findTeams(String(row.home||row.h||"")), a=findTeams(String(row.away||row.a||""));
          const hs=row.hs??row.homeScore??row.hg, as=row.as??row.awayScore??row.ag;
          if(!h.length||!a.length||hs==null||as==null){ skip++; return; }
          const m=S.matches.find(x=>x.h===h[0].k&&x.a===a[0].k);
          if(!m){ skip++; return; }
          m.hs=+hs; m.as=+as; n++;
        });
        save();
        out.innerHTML=`<div class="banner ok">Načteno ${n} výsledků${skip?", "+skip+" řádků se nepodařilo spárovat":""}.</div>`;
        setTimeout(render,1200);
      })
      .catch(err=>{ out.innerHTML=`<div class="banner err">Nepovedlo se: ${esc(err.message)}. Nejčastěji chybí u zdroje hlavička CORS, nebo je adresa špatně.</div>`; });
  }

  else if(act==="save-atips"){
    let n=0;
    document.querySelectorAll("[data-atip]").forEach(inp=>{
      if(inp.dataset.side!=="h") return;
      const key=inp.dataset.atip, [pid,mid]=key.split("|");
      const a=document.querySelector(`[data-atip="${key}"][data-side="a"]`);
      if(inp.value!==""&&a.value!==""){ setTip(pid,mid,inp.value,a.value); n++; }
      else setTip(pid,mid,null,null);
    });
    save(); toast(`Uloženo ${n} tipů.`);
  }
  else if(act==="add-player"){
    const raw=document.getElementById("newplayer").value;
    const names=raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if(!names.length){ toast("Napiš jméno.","err"); return; }
    names.forEach(n=>{ if(!S.players.some(p=>norm(p.name)===norm(n))) S.players.push({id:uid(),name:n,paid:false}); });
    save(); toast(names.length>1?`Přidáno ${names.length} hráčů.`:`Hráč ${names[0]} přidán.`);
  }
  else if(act==="save-players"){
    document.querySelectorAll("[data-pname]").forEach(inp=>{
      const p=S.players.find(x=>x.id===inp.dataset.pname); if(p) p.name=inp.value.trim()||p.name;
    });
    document.querySelectorAll("[data-ppaid]").forEach(inp=>{
      const p=S.players.find(x=>x.id===inp.dataset.ppaid); if(p) p.paid=inp.checked;
    });
    save(); toast("Hráči uloženi.");
  }
  else if(act==="del-player"){
    const p=S.players.find(x=>x.id===t.dataset.id);
    if(!confirm(`Smazat hráče ${p.name} i s jeho tipy?`)) return;
    S.players=S.players.filter(x=>x.id!==t.dataset.id); delete S.tips[t.dataset.id];
    save(); toast("Hráč smazán.");
  }

  else if(act==="del-logo"){
    const k=t.dataset.id;
    if(S.logos) delete S.logos[k];
    delete LOGOS[TMAP[k].sl];
    save(); resolveLogos(); toast("Logo "+k+" zrušeno.");
  }

  else if(act==="export-logos"){
    download("loga.json", JSON.stringify({kind:"tipovacka-loga", logos:S.logos||{}}), "application/json");
  }
  else if(act==="export-site"){ exportSite(t); }
  else if(act==="export"){ download("tipovacka-zaloha-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S,null,2)); }
  else if(act==="export-public"){ download("data.json", JSON.stringify(S)); }
  else if(act==="reset"){
    if(!confirm("Opravdu vymazat všechna data? Tohle vrátit nejde. Loga klubů zůstanou.")) return;
    const keep=S.logos||{};
    S=freshState(); S.logos=keep; ADMIN=false;
    try{ localStorage.removeItem(ADMINDEV_KEY); localStorage.removeItem(MYTIPS_KEY); }catch(e){}
    save(); toast("Data vymazána, loga zůstala.");
  }
  else if(act==="save-cfg"){
    S.cfg.fee=+document.getElementById("cfgfee").value||0;
    S.cfg.potNote=document.getElementById("cfgnote").value.trim()||"Vítěz bere vše";
    S.cfg.pin=document.getElementById("cfgpin").value.trim()||"1234";
    save(); toast("Nastavení uloženo.");
  }
});

document.addEventListener("change", e=>{
  if(e.target.dataset && e.target.dataset.logo){
    const k=e.target.dataset.logo, f=e.target.files[0]; if(!f) return;
    if(f.size>4*1024*1024){ toast("Obrázek je moc velký, dej něco do 4 MB.","err"); return; }
    fileToLogo(f, uri=>{
      if(!uri){ toast("Tenhle soubor se nepodařilo načíst jako obrázek.","err"); return; }
      S.logos=S.logos||{}; S.logos[k]=uri; save();
      LOGOS[TMAP[k].sl]=uri; logoStyles();
      toast("Logo "+k+" nahráno.");
    });
    return;
  }
  if(e.target.id==="logosmulti"){
    const files=e.target.files; if(!files||!files.length) return;
    const out=document.getElementById("logoout");
    if(out) out.innerHTML=`<div class="banner" style="margin-top:12px">Zpracovávám ${files.length} souborů…</div>`;
    loadLogoFiles(files, (ok,skip)=>{
      save(); logoStyles();
      if(out) out.innerHTML =
        `<div class="banner ${ok.length?"ok":"err"}" style="margin-top:12px">Nahráno ${ok.length} log${ok.length?": "+ok.join(", "):""}.
         ${skip.length?"<br>Nepřiřazeno: "+skip.map(esc).join(", ")+" — přejmenuj podle názvů níž a zkus znovu.":""}</div>`;
      setTimeout(render,1500);
    });
    return;
  }
  if(e.target.id==="logopack"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        const src=d.logos||d;
        let n=0;
        S.logos=S.logos||{};
        Object.keys(src).forEach(k=>{
          if(TMAP[k] && typeof src[k]==="string" && src[k].startsWith("data:image")){
            S.logos[k]=src[k]; LOGOS[TMAP[k].sl]=src[k]; n++;
          }
        });
        if(!n) return toast("V souboru nejsou žádná loga, která bych poznal.","err");
        save(); logoStyles(); toast(`Načteno ${n} log.`);
      }catch(err){ toast("Soubor se nepodařilo přečíst.","err"); }
    };
    rd.readAsText(f);
    return;
  }
  if(e.target.id==="importfile"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ S=migrate(JSON.parse(rd.result)); save(); toast("Záloha nahrána."); }
                    catch(err){ toast("Soubor se nepodařilo přečíst.","err"); } };
    rd.readAsText(f);
  }
});

// Enter v poli tipu skočí na další
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  const inp=e.target;
  if(!inp.matches("input[type=number]")) return;
  e.preventDefault();
  const all=[...document.querySelectorAll("input[type=number]")];
  const i=all.indexOf(inp); if(i>-1&&all[i+1]) all[i+1].focus();
});

function download(name,content,mime){
  const b=new Blob([content],{type:mime||"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============================================================
   11. START
   ============================================================ */

function boot(){
  applyTheme(currentTheme());
  load();

  // Data zapečená přímo do stránky (publikace jedním souborem).
  const seedEl=document.getElementById("seed");
  if(seedEl){
    try{
      const d=JSON.parse(seedEl.textContent);
      if(d&&d.matches){
        const pubT=Date.parse(d.updated||0)||0, locT=Date.parse(S.updated||0)||0;
        if(!isAdminDevice() || pubT>locT){ S=migrate(d); save(); }
      }
    }catch(e){ console.warn("Zapečená data se nepodařilo přečíst:",e); }
  }

  applyHash();
  VIEW.round = currentRound();
  render();
  resolveLogos();
  startTicker();

  // Pokud vedle stránky leží data.json, ber ho jako zveřejněnou verzi.
  // Na zařízení správce ustoupí rozpracovaným datům, pokud jsou novější.
  fetch("./data.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).then(d=>{
    if(!d||!d.matches) return;
    const pubT=Date.parse(d.updated||0)||0, locT=Date.parse(S.updated||0)||0;
    if(!isAdminDevice() || pubT>locT){ S=migrate(d); save(); render(); resolveLogos(); }
  }).catch(()=>{});
}

window.addEventListener("hashchange",()=>{ if(applyHash()) render(); });

boot();
</script>
